# Shared config values referenced by templates and scripts throughout this
# repo. Centralising the chosen shell here means every script/template that
# needs to know "which shell did we pick" reads it from one place instead of
# hardcoding "zsh" everywhere.
shell: zsh

git:
  name: Andrew Willis
  email: andrew@gravytrain.co.uk
  # 1Password secret reference to the *public key* field of the SSH Key item
  # used for commit signing (the same item whose `private key` field is
  # listed in dot_config/dotfiles/ssh-keys.txt). The key itself is fetched
  # from 1Password at apply time (run_onchange_0025) and by
  # `git-signing-key-refresh`/`ssh-login` into ~/.config/git/signing_key.pub,
  # not stored in this repo. Item titles may only contain letters, digits,
  # spaces and - _ . — anything else (e.g. parentheses) fails with "invalid
  # secret reference"; use the item's ID instead (README, "1Password
  # references with special characters"). Leave blank to skip signing entirely;
  # dot_gitconfig.tmpl only adds [gpg]/[commit] when this is set.
  signing_key_ref: "op://Private/Andrew Willis - SSH/public key"

aws:
  default_region: eu-west-2

# How long `op-login`, `aws-login` and `ssh-login` results are kept and
# reused across new shells before the next login re-queries 1Password (see
# DOTFILES_CACHE_TTL in dot_zshrc.tmpl). Keep <= 12: that's how long the
# temporary AWS credentials themselves live. Run `chezmoi apply` and open a
# new shell after changing; for a one-off override, export
# DOTFILES_CACHE_TTL=<seconds> before the shell starts.
credential_cache_hours: 4

# 1Password vault/account id — aws-vault's op-desktop backend (see
# run_once_0015-install-aws-vault.sh.tmpl) hard-requires both, erroring
# "environment variable unset or empty: OP_VAULT_ID" without them, on macOS
# same as WSL. Leave blank until you've run `op vault list` / `op account
# list --format=json` once to find your values (see README, "aws-vault env
# vars"); dot_zshrc.tmpl only exports these on macOS when set (WSL sets its
# own copies as persistent Windows env vars instead — see
# docs/setup-sequence.md item 17). Key is quoted/accessed via `index` in
# templates since Go templates can't dot into a field name starting with a
# digit.
"1password":
  op_vault_id: "tp37ul3wds7rm4cszm7ug3d46y"
  op_account_id: "T4HBK2Q3SBD6RIS3SWD5O57GL4"

# Keyed by aws-vault profile name (the argument to `aws-login`), each mapped
# to a LIST of domain configs — one profile/account can have more than one
# CodeArtifact domain (e.g. two unrelated domains both reachable via the
# `gravytrain` profile). `npm_scopes` is only set for domains that back an
# npm registry — when set, `codeartifact_auth` (dot_zshrc.tmpl) writes the
# `${<env>}`-placeholder npm config for each listed scope against that
# domain's repository (a single CodeArtifact repository can be the upstream
# for more than one npm scope); when unset (e.g. a Maven/Gradle-backed
# domain) it just exports the token and skips npm entirely. `env` names the
# variable the token is exported as; defaults to CODEARTIFACT_AUTH_TOKEN
# when omitted — give every domain within the same profile a distinct `env`
# if more than one of them is npm-backed, otherwise their tokens will
# clobber each other in the shared default var.
codeartifact:
  gravytrain:
    - domain: gravytrain
      repository: Triton
      npm_scopes: [gravytrain]
  kgm:
    - domain: kgm
      repository: java
      env: KGM_CODEARTIFACT_AUTH_TOKEN

rds:
  # Stable prefix shared by every stage's cluster identifier for each
  # system — each stage prepends its own name (dev-/staging-/prod-) and RDS
  # appends an opaque generated suffix, e.g.
  # prod-gt-triton-core-database-coredatabasecluster-0ee0jjp507zm. The name
  # is truncated to a stage-dependent length (staging-gt-triton-core-databa-…,
  # prod-kgm-broker-centre-databa-…), so each prefix is the shortest form
  # that all three stages share.
  systems:
    kgm: kgm-broker-centre-dat
    triton: gt-triton-core-databa
  # SSH user the jump box expects, used by connect-to-aws-jump-server.sh.tmpl.
  jump_user: gtjump

# ElastiCache (Redis) standalone cache clusters, tunnelled alongside the RDS cluster
# by connect-to-aws-jump-server.sh.tmpl (local 127.0.0.1:6379). Same idea as
# `rds.systems`: the stable prefix of the cache cluster ID after the
# "<stage>-" part. A system with no entry here (or no matching group at
# connect time) just gets the database tunnel, with a warning.
redis:
  systems:
    kgm: kgm-broker-centre-session-cache
    triton: leads-data-store

# Direct (non-jump-box) servers — keyed by the alias name dot_zshrc.tmpl
# generates for each (`alias <key>='ssh ubuntu@<value>'`). All reachable as
# `ubuntu` using whichever key the 1Password SSH agent offers (see
# dot_zshrc.tmpl's "1Password SSH agent" section) — no per-server user or
# identity file, so a flat name->hostname map is all this needs.
servers:
  bi-app-dev: app.dev.bf1.grvytrn.co.uk
  bi-app-prod: app.prod.bf1.grvytrn.co.uk
  bi-web-dev: web.dev.bf2.bedfordinsurance.co.uk
  bi-web-prod: web.prod.bf2.bedfordinsurance.co.uk
  qs-app-dev: app.dev.qs1.grvytrn.co.uk
  qs-app-prod: app.prod.qs1.grvytrn.co.uk
  qs-web-dev: web.dev.qs1.grvytrn.co.uk
  qs-web-prod: web.prod.qs1.grvytrn.co.uk
